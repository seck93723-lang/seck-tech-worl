    };
  })}

        d.querySelector("img").onclick=()=>{if(i>0){p.photos.unshift(p.photos.splice(i,1)[0]);drawThumbs()}};th.appendChild(d)});
      if(p.photos.length<5){const a=document.createElement("label");a.className="addph";a.innerHTML='+<input type="file" accept="image/*" multiple id="e-file" aria-label="Aggiungi foto">';
        a.querySelector("input").onchange=async ev=>{const files=[...ev.target.files].slice(0,5-p.photos.length);for(const f of files){try{p.photos.push(await compress(f))}catch(e){$("e-msg").textContent="Una foto non si è potuta leggere."}}drawThumbs()};th.appendChild(a)}}
    drawThumbs();
    function drawVideo(){const vb=$("vbox");
      if(p.video){vb.innerHTML='<video class="vprev" src="'+esc(mediaSrc(p.video))+'" controls playsinline muted></video><div class="vrow"><button class="btn small danger" type="button" id="v-del">Togli video</button></div>';$("v-del").onclick=()=>{delete p.video;drawVideo()};return}
      vb.innerHTML='<div class="vrow"><label class="btn small" for="e-video">+ Aggiungi video</label><input id="e-video" type="file" accept="video/*" hidden><span class="vnote" id="vnote">Viene alleggerito e salvato senza audio. Tienilo corto.</span></div>';
      $("e-video").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const n=$("vnote");const sb=$("e-save");sb.disabled=true;n.textContent="Preparazione video… 0%";
        try{p.video=await processVideo(f,x=>{const e=$("vnote");if(e)e.textContent="Preparazione video… "+Math.round(x*100)+"%"});const mb=(p.video.length*0.75/1048576).toFixed(1);drawVideo();$("e-msg").textContent="";const n2=document.createElement("span");n2.className="vnote";n2.textContent="Video pronto ("+mb+" MB). Premi Salva.";$("vbox").querySelector(".vrow").appendChild(n2)}
        catch(e){n.textContent="Questo video non si è potuto preparare su questo telefono. Prova un video più corto (meno di 2 MB)."}
        sb.disabled=false}}
    drawVideo();
    $("e-cancel").onclick=closeSheet;
    if(orig){const d=$("e-del");let armed=false;d.onclick=async()=>{if(!armed){armed=true;d.textContent="Tocca di nuovo per eliminare";return}
      DATA.phones=DATA.phones.filter(x=>x.id!==id);const ok=await save($("e-msg"),d);if(!ok)DATA.phones.push(orig)}}
    $("e-save").onclick=async()=>{
      p.brand=$("e-brand").value;p.model=$("e-model").value.trim();p.storage=$("e-storage").value;p.color=$("e-color").value.trim();
      p.battery=$("e-batt").value?Math.max(0,Math.min(100,parseInt($("e-batt").value,10))):"";p.price=$("e-price").value?+$("e-price").value:"";
      p.condition=$("e-cond").value;p.status=$("e-status").value;p.notes=$("e-notes").value.trim();delete p.example;
      if(!p.model){$("e-msg").textContent="Scrivi il modello del telefono.";return}
      p.hidePrice=!$("e-show").checked;
      if(p.price===""&&!p.hidePrice){$("e-msg").textContent="Inserisci il prezzo, oppure togli la spunta Mostra il prezzo.";return}
      const backup=DATA.phones.slice();
      if(orig)DATA.phones=DATA.phones.map(x=>x.id===id?p:x);else DATA.phones.unshift(p);
      const ok=await save($("e-msg"),$("e-save"));if(!ok)DATA.phones=backup;
    };
  }
  function openSettings(){
    const s=DATA.shop;
    sheet('<h2>Impostazioni vetrina</h2><div class="fields">'+
      '<div class="f full"><label for="s-name">Nome negozio</label><input id="s-name" value="'+esc(s.name)+'"></div>'+
      '<div class="f full"><label for="s-wa">Numero WhatsApp (con prefisso, es. 39 333 1234567)</label><input id="s-wa" inputmode="tel" value="'+esc(s.whatsapp)+'" placeholder="39 333 1234567"></div>'+
      '<div class="f full"><label for="s-phone">Numero per chiamare (se diverso da WhatsApp)</label><input id="s-phone" inputmode="tel" value="'+esc(s.phone)+'" placeholder="Uguale a WhatsApp"></div>'+
      '<div class="f full"><label for="s-pp">PayPal.me (nome utente o link, es. paypal.me/seckteck)</label><input id="s-pp" value="'+esc(s.paypal)+'" placeholder="paypal.me/..."></div>'+
      '<div class="f full"><label for="s-city">Città / zona</label><input id="s-city" value="'+esc(s.city)+'" placeholder="Seregno"></div>'+
      '<div class="f full"><label for="s-note">Frase sotto il nome</label><input id="s-note" value="'+esc(s.note)+'"></div>'+
      '</div><div class="msg" id="s-msg"></div><div class="row"><button class="btn" id="s-cancel" type="button">Annulla</button><button class="btn primary" id="s-save" type="button">Salva</button></div>');
    $("s-cancel").onclick=closeSheet;
    $("s-save").onclick=async()=>{const old=JSON.stringify(DATA.shop);
      DATA.shop={name:$("s-name").value.trim()||"Telefoni Usati",whatsapp:$("s-wa").value.trim(),phone:$("s-phone").value.trim(),instagram:"",facebook:"",paypal:$("s-pp").value.trim(),city:$("s-city").value.trim(),note:$("s-note").value.trim()};
      const ok=await save($("s-msg"),$("s-save"));if(!ok)DATA.shop=JSON.parse(old)};
  }

  $("themebtn").onclick=()=>{const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("stw-theme",n)}catch(e){}renderTheme()};
  if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",renderTheme)}catch(e){}}
  $("q").addEventListener("input",e=>{q=e.target.value.trim();renderGrid()});
  $("btnAdd").onclick=()=>openEditor(null);
  $("btnSettings").onclick=openSettings;
  $("btnPreview").onclick=()=>{if(!canAdmin)return;isAdmin=!isAdmin;closeSheet();$("btnAdd").hidden=!isAdmin;$("btnSettings").hidden=!isAdmin;$("btnPreview").textContent=isAdmin?"Vedi come cliente":"Torna alla gestione";$("adminInfo").textContent=isAdmin?"Modalità gestione: questi pulsanti li vedi solo tu. I clienti vedono solo i telefoni.":"Anteprima: così vedono la vetrina i tuoi clienti (questa barra la vedi solo tu).";renderAll();window.scrollTo({top:0,behavior:"smooth"})};
  $("btnLogout").onclick=logout;
  $("btnShare").onclick=()=>{const url=pageBase()+(GH&&!/index\.html$/.test(GH.page)?GH.page.split("/").pop():"");
    const txt="📱 "+(DATA.shop.name||"Seck Tech World")+" – telefoni nuovi e usati con foto, prezzo e stato batteria. Guarda qui 👉 "+url;
    window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank","noopener")};
  // entrata nascosta: aggiungi #admin al link, oppure tocca 5 volte il logo
  let taps=0,tapT=0;$("shopName").addEventListener("click",()=>{const n=Date.now();taps=n-tapT<1500?taps+1:1;tapT=n;if(taps>=5&&!canAdmin){taps=0;openLogin()}});
  window.addEventListener("hashchange",()=>{if(location.hash==="#admin"&&!canAdmin)openLogin()});
  renderAll();
  (async()=>{
    const c=readCfg();
    if(c&&c.token){try{await connect(Object.assign({},c,{page:(detectRepo()||{}).page||c.page}));return}catch(e){GH=null;if(e.status===401){writeCfg(null);toast("Il codice GitHub non è più valido: entra di nuovo",4000)}}}
    await loadPublic();
    if(location.hash==="#admin")openLogin();
  })();
})();
</script>
</body>
